<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevBuddy — Generate Code</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/ai-modal.css}">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">⚡</div>
      <span>Dev<em>Buddy</em></span>
    </div>

    <div class="sidebar-label">Navigation</div>
    <a href="/snippets" class="nav-link">
      <span class="nav-icon">📂</span> Snippets
    </a>
    <a href="/snippets/new" class="nav-link">
      <span class="nav-icon">＋</span> New Snippet
    </a>
    <a href="/ai/generate-page" class="nav-link active">
      <span class="nav-icon">✨</span> Generate Code
    </a>
    <a href="/github/import" class="nav-link">
      <span class="nav-icon">🐙</span> GitHub Import
    </a>

    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="user-avatar"
             th:text="${#strings.toUpperCase(#strings.substring(#authentication.name,0,1))}">U</div>
        <div class="user-info">
          <div class="user-name" th:text="${#authentication.name}">Username</div>
          <div class="user-role">Developer</div>
        </div>
      </div>
      <form th:action="@{/logout}" method="post" style="margin-top:8px;">
        <button type="submit" class="nav-link btn-ghost"
                style="width:100%;border:none;cursor:pointer;background:transparent;
                               color:var(--text-secondary);font-family:'Sora',sans-serif;">
          <span class="nav-icon">🚪</span> Sign Out
        </button>
      </form>
    </div>
  </aside>

  <main class="main">

    <div class="page-header fade-up">
      <div>
        <h1 class="page-title">✨ Generate Code</h1>
        <p class="page-subtitle">Describe what you need — Grok AI writes it for you</p>
      </div>
    </div>

    <div class="form-page fade-up fade-up-1" style="max-width:820px;">
      <div class="form-card">

        <div class="form-card-header">
          <span style="font-size:22px;">🤖</span>
          <h2>Code Generator</h2>
          <span class="lang-badge lang-default" style="margin-left:auto;">Powered by Grok</span>
        </div>

        <div class="form-card-body">
          <div class="form-row">
            <div class="form-group" style="grid-column:1/-1;">
              <label for="genLanguage">Target Language</label>
              <select id="genLanguage">
                <option value="Java">Java</option>
                <option value="JavaScript">JavaScript</option>
                <option value="TypeScript">TypeScript</option>
                <option value="Python" selected>Python</option>
                <option value="Go">Go</option>
                <option value="Rust">Rust</option>
                <option value="SQL">SQL</option>
                <option value="Bash">Bash</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="genPrompt">Describe what you want</label>
            <textarea id="genPrompt"
                      rows="5"
                      placeholder="e.g. A binary search function that returns the index or -1 if not found"
                      style="font-family:'Sora',sans-serif;"></textarea>
          </div>

          <div class="example-prompts">
            <div class="example-label">Try an example:</div>
            <div class="example-chips">
              <button class="example-chip" onclick="fillPrompt(this)">
                Merge sort implementation
              </button>
              <button class="example-chip" onclick="fillPrompt(this)">
                REST API call with error handling
              </button>
              <button class="example-chip" onclick="fillPrompt(this)">
                Read and parse a JSON file
              </button>
              <button class="example-chip" onclick="fillPrompt(this)">
                Fibonacci sequence with memoization
              </button>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" id="generateBtn" onclick="generateCode()">
            ✨ Generate with Grok
          </button>
        </div>
      </div>

      <div class="generate-result-card" id="generateResultCard" style="display:none;">
        <div class="generate-result-header">
          <div class="generate-result-title">
            <span id="resultLang" class="lang-badge lang-default">Lang</span>
            Generated Code
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost" onclick="copyGenResult()" style="font-size:12.5px;padding:6px 12px;">
              📋 Copy
            </button>
            <button class="btn btn-primary" onclick="saveAsSnippet()" style="font-size:12.5px;padding:6px 14px;">
              💾 Save as Snippet
            </button>
          </div>
        </div>
        <div class="ai-result" id="generateResult"></div>
      </div>

      <div class="generate-loading" id="generateLoading" style="display:none;">
        <div class="ai-spinner" style="width:32px;height:32px;border-width:3px;"></div>
        <span>Grok is writing your code...</span>
      </div>

      <div class="ai-modal-error" id="generateError" style="display:none;margin-top:16px;">
        <span>⚠️</span> <span id="generateErrorText"></span>
      </div>
    </div>

  </main>
</div>

<div id="csrf"
     th:attr="data-token=${_csrf.token}, data-header=${_csrf.headerName}"
     style="display:none;"></div>

<script th:src="@{/js/ai.js}"></script>
<script>
  function fillPrompt(btn) {
      document.getElementById('genPrompt').value = btn.textContent.trim();
      document.querySelectorAll('.example-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
  }

  async function generateCode() {
      const prompt = document.getElementById('genPrompt').value.trim();
      const language = document.getElementById('genLanguage').value;

      if (!prompt) {
          document.getElementById('genPrompt').focus();
          return;
      }

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.textContent = 'Generating...';

      document.getElementById('generateResultCard').style.display = 'none';
      document.getElementById('generateError').style.display     = 'none';
      document.getElementById('generateLoading').style.display   = 'flex';

      try {
          const csrf  = document.getElementById('csrf');
          const token = csrf.dataset.token;
          const header = csrf.dataset.header;

          const res = await fetch('/ai/generate', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  [header]: token
              },
              body: JSON.stringify({ prompt, language })
          });

          const data = await res.json();
          document.getElementById('generateLoading').style.display = 'none';

          if (data.success) {
              document.getElementById('generateResult').innerHTML = formatAiResult(data.result);
              document.getElementById('resultLang').textContent   = language;
              document.getElementById('resultLang').className     = `lang-badge lang-${language.toLowerCase()}`;
              document.getElementById('generateResultCard').style.display = 'block';
              // Store for save
              window._lastGenResult   = data.result;
              window._lastGenLanguage = language;
              window._lastGenPrompt   = prompt;
          } else {
              showGenerateError(data.error || 'Unknown error');
          }
      } catch (e) {
          document.getElementById('generateLoading').style.display = 'none';
          showGenerateError('Network error: ' + e.message);
      } finally {
          btn.disabled = false;
          btn.textContent = '✨ Generate with Grok';
      }
  }

  function showGenerateError(msg) {
      document.getElementById('generateErrorText').textContent = msg;
      document.getElementById('generateError').style.display  = 'flex';
  }

  function copyGenResult() {
      if (window._lastGenResult) {
          navigator.clipboard.writeText(window._lastGenResult);
      }
  }

  function saveAsSnippet() {

      const title    = encodeURIComponent((window._lastGenPrompt   || '').substring(0, 100));
      const language = encodeURIComponent(window._lastGenLanguage  || '');
      const content  = encodeURIComponent(window._lastGenResult    || '');
      window.location.href = `/snippets/new?title=${title}&language=${language}&content=${content}`;
  }
</script>

</body>
</html>
